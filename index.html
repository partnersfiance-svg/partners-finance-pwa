<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <meta name="description" content="Partners Finance - Gestion financière">
  <link rel="manifest" href="manifest.json">
  <title>Partners Finance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #10243a;
    }
    header {
      background: #10243a;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 25px; }
    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 5px 20px #10243a12;
    }
    .logo { font-size: 42px; margin-bottom: 12px; }
    p { line-height: 1.6; color: #526174; }
    a {
      display: block;
      background: #1677ff;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 22px;
    }
    footer { margin-top: 25px; font-size: 12px; color: #718096; }
  </style>
</head>
<body>
  <header>
    <h1>Partners Finance</h1>
  </header>
  <main>
    <div class="card">
      <div class="logo">💼</div>
      <h2>Bienvenue</h2>
      <p>Votre espace de gestion financière Partners Finance.</p>
      <a href="https://script.google.com/macros/s/AKfycbyE_tIJ8ap5d0jCXfI0JEW-mOygnWhxYuMjjZFtA_oHGYPd5mjRgCD2cyWpmWhT1me0/exec">
        Ouvrir Partners Finance
      </a>
    </div>
    <footer>Partners Finance · Application web</footer>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.log("Service worker:", error));
      });
    }
  </script>
</body>
