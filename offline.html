
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <title>Hors connexion - Partners Finance</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #10243a;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 16px;
    }
    p { line-height: 1.6; color: #526174; }
    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 9px;
      background: #1677ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Partners Finance</h1>
    <h2>Connexion indisponible</h2>
    <p>Vérifie ta connexion Internet pour accéder à ton espace financier.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
